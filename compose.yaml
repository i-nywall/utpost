services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: utpost
      POSTGRES_PASSWORD: utpost
      POSTGRES_DB: utpost
    ports:
      - "5433:5432"
    volumes:
      - utpost_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utpost -d utpost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - utpost_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      POSTGRES_URL: postgres://utpost:utpost@postgres:5432/utpost
      MONGO_URL: mongodb://mongo:27017/utpost
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:3001"
    depends_on:
      - api

volumes:
  utpost_pgdata:
  utpost_mongodata:
